[project]
name = "nl2sql"
version = "0.1.0"
description = "Prototype: ask questions in plain English, get SQL and results from your database using Claude"
requires-python = ">=3.10"
dependencies = ["anthropic", "pydantic>=2", "sqlglot>=30"]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2", "psycopg[binary]>=3"]
mysql = ["sqlalchemy>=2", "pymysql"]
dev = ["pytest", "sqlalchemy>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nl2sql"]

[tool.setuptools.package-data]
nl2sql = ["data/*.jsonl", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
